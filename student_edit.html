<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Studentpage</title>
</head>
<body>
<h4> welcome to Student page</h4>
<form action="/updatestudenttodb" method="post">
    <table>
        <tr>
            <td>Enter the id</td>
            <td><input type="number" name="id" value={{studentdata[0]}} readonly></td>
        </tr>
        <tr>
            <td>Enter the name</td>
            <td><input type="text" name="name" value={{studentdata[1]}}></td>

    </table>

</form>
</body>
</html>
